services:
  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/learnneo4j      # mật khẩu chỉ dùng cho bài lab
    volumes:
      - neo4j-data:/data
      - ./import:/var/lib/neo4j/import  # file CSV cho LOAD CSV
      - ./cypher:/cypher:ro             # để chạy file .cypher bằng cypher-shell -f
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p learnneo4j 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
volumes:
  neo4j-data:
